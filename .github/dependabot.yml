# Weekly version updates. Alerts are a separate switch (Settings > Code security).
# Grouped so a week of updates is one pull request per ecosystem, not one per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      pip: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
