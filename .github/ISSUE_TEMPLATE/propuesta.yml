name: Propuesta
description: Un tema que te gustaría ver, o una mejora del sitio
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "¡Me encanta que me propongan temas! Las leo yo, Antonio, y las tengo en cuenta al decidir qué escribo."
  - type: textarea
    id: propuesta
    attributes:
      label: Qué propones
      description: Un tema, una comparativa, una mejora de la web…
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Para qué te serviría
