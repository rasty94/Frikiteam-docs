name: Errata
description: Algo de una entrada o de la documentación es incorrecto
labels: ["bug"]
body:
  - type: input
    id: pagina
    attributes:
      label: Página o entrada
      description: La dirección donde lo has visto
      placeholder: https://frikiteam.es/…
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Qué está mal
      description: Cita el párrafo o el comando y explica qué falla
    validations:
      required: true
  - type: textarea
    id: correcto
    attributes:
      label: Qué debería decir
      description: Si lo sabes. Indica tu versión o sistema si influye
